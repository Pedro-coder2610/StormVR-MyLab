; Firmware do controle VR (ESP32 + MPU6050) - envia o estado por Wi-Fi UDP para o driver StormVR e por Bluetooth LE para o app.
; Edite include/config.h (Wi-Fi) e grave com:  pio run -t upload   (ou botao "Upload" do PlatformIO IDE)
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
