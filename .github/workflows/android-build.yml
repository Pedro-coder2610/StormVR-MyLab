name: Build StormVR Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK packages required by StormVR
        run: |
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p Source/android --no-daemon assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: StormVR-debug-APK
          path: Source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
