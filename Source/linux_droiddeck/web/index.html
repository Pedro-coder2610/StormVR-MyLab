<title>StormVR — painel</title>
<style>
:root{--bg:#0d0618;--card:#1d1136;--card2:#2d1a54;--fg:#f6f1ff;--mut:#a893d6;--acc:#9d4eff;--ok:#c494ff;--bad:#ff5d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:#07030f;padding:10px 12px;border-bottom:1px solid #2d1a54}
h1{font-size:17px;margin:0 0 8px;display:flex;gap:8px;align-items:center}h1 small{font-weight:400;color:var(--mut)}
.badge{font-size:12px;border-radius:99px;padding:2px 10px;background:#333;color:#ddd}.badge.on{background:#3b1a78;color:#e6d2ff}.badge.off{background:#4a1838;color:#ffc4cb}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:8px 14px;font-size:14px}nav button.sel{background:var(--acc);color:#fff}
main{padding:10px 12px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.w{background:var(--card);border-radius:12px;padding:10px 12px}.w label{display:block;color:var(--fg);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center}.row input[type=range]{flex:1;height:34px;accent-color:var(--acc)}.val{min-width:64px;text-align:right;color:#d9c2ff;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center}.chk input{width:26px;height:26px;accent-color:var(--acc)}
select{width:100%;padding:10px;border-radius:8px;background:var(--card2);color:var(--fg);border:0;font-size:15px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--card2);color:var(--fg);font-size:15px}.btn:active{background:var(--acc)}
.grp{grid-column:1/-1;color:var(--mut);font-weight:600;padding:8px 2px 0;border-bottom:1px solid #3a1f6b}
.mini{color:var(--mut);font-size:12px}
pre{margin:0;white-space:pre-wrap;font:12px/1.4 ui-monospace,Consolas,monospace;color:#e7d8ff}
canvas{width:100%;background:#0a0614;border-radius:10px}

<main id="main"></main>
<script>
const PIN=new URLSearchParams(location.search).get('pin')||localStorage.getItem('pin')||'';
if(PIN)localStorage.setItem('pin',PIN);
const q=PIN?('?pin='+encodeURIComponent(PIN)):'';
let M=null,vals={},cur=0,touched={},ctl={};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
async function api(path,body){const r=await fetch(path+q,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status==401){const p=prompt('PIN:');if(p){localStorage.setItem('pin',p);location.search='?pin='+p}};return r.json()}
function fmtv(w,v){if(w.int)return Math.round(v);const d=w.step<0.01?3:(w.step<0.1?2:(w.step<1?1:0));return Number(v).toFixed(d)}
let sendT={};
function setVal(key,v){vals[key]=v;touched[key]=Date.now();clearTimeout(sendT[key]);sendT[key]=setTimeout(()=>api('/api/set',{key,value:v}),35)}
function optsOf(w){return w.opts||M.optsets[w.optset]||[]}
function build(){
  const main=document.getElementById('main');main.innerHTML='';ctl={};
  const tab=cur<M.tabs.length?M.tabs[cur]:null;
  if(!tab){buildDiag(main);return}
  for(const w of tab.widgets){
    if(w.t==='group'){main.appendChild($('div','grp',w.title));continue}
    const c=$('div','w');
    if(w.t==='slider'){
      c.appendChild($('label','',w.label));const r=$('div','row');const i=$('input');i.type='range';i.min=w.min;i.max=w.max;i.step=w.step;i.value=vals[w.key]??w.def;
      const v=$('span','val',fmtv(w,i.value));i.oninput=()=>{v.textContent=fmtv(w,i.value);setVal(w.key,w.int?Math.round(+i.value):+i.value)};
      r.appendChild(i);r.appendChild(v);c.appendChild(r);ctl[w.key]={w,i,v}
    }else if(w.t==='check'){
      const l=$('label','chk');const i=$('input');i.type='checkbox';i.checked=!!(vals[w.key]??w.def);i.onchange=()=>{
        setVal(w.key,i.checked)};l.appendChild(i);l.appendChild($('span','',w.label));c.appendChild(l);ctl[w.key]={w,i}
    }else if(w.t==='cycle'){
      c.appendChild($('label','',w.label));const s=$('select');optsOf(w).forEach((o,n)=>{const op=$('option','',o);op.value=n;s.appendChild(op)});
      s.value=vals[w.key]??w.def;s.onchange=()=>{const n=+s.value;
        setVal(w.key,n)};c.appendChild(s);ctl[w.key]={w,i:s}
    }else if(w.t==='button'){
      const b=$('button','btn',w.label);b.onclick=async()=>{
        if(typeof w.cmd==='number'){
          if(w.cmd===13&&!confirm('Reiniciar o SteamVR? O jogo atual será fechado.'))return;
          if(w.cmd===12&&!confirm('Resetar o piso / espaço de jogo do SteamVR? (corrige \'dentro do chão\')'))return;
          const r=await api('/api/cmd',{cmd:w.cmd});if(!r.ok){alert('O driver não está rodando (abra o SteamVR).');return}
          const old=b.textContent;b.textContent='✓ Enviado';setTimeout(()=>{b.textContent=old},1200)}
        else{if(w.cmd==='reset_all'&&!confirm('Restaurar TODAS as configurações para o padrão?'))return;
          const what={reset_all:'all',reset_pos:'pos',reset_arm:'arm',reset_coord:'coord'}[w.cmd];await api('/api/reset',{what});}};
      c.appendChild(b)
    }
    main.appendChild(c)
  }
}
function buildDiag(main){
  const d=$('div','w dia');d.innerHTML='<pre id="dia">Aguardando o driver…</pre>';main.appendChild(d);
  const a=$('div','w dia');a.innerHTML='<label>Arm Model — prévia ao vivo (de cima / lateral)</label><canvas id="cv" width="640" height="260"></canvas>';main.appendChild(a);
}
function drawArms(t){
  const cv=document.getElementById('cv');if(!cv||!t.ctl)return;const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
  const panes=[['De cima',0,2],['Lateral',2,1]];
  panes.forEach(([name,ax,ay],n)=>{const ox=n*320+160,oy=130,S=180;g.fillStyle='#a893d6';g.font='12px sans-serif';g.fillText(name,n*320+8,16);
    g.strokeStyle='#3a1f6b';g.strokeRect(n*320+4,24,312,228);
    t.ctl.forEach((c,h)=>{if(!c.armOn)return;const J=c.armJ;g.strokeStyle=h==0?'#c494ff':'#ffb04a';g.lineWidth=3;g.beginPath();
      J.forEach((p,k)=>{let x=p[0],y=p[2],z=p[1];const px=ox+(ax===0?p[0]:p[2])*S,py=oy+(name==='De cima'?p[2]:-p[1])*S;k?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
      const e=J[2];g.fillStyle=g.strokeStyle;g.beginPath();g.arc(ox+(ax===0?e[0]:e[2])*S,oy+(name==='De cima'?e[2]:-e[1])*S,5,0,7);g.fill()})});
}
function diagText(t){
  if(!t.alive)return'Driver: SteamVR fechado (ou driver não carregado).\nOs ajustes ficam guardados e o driver aplica tudo ao abrir.';
  const L=['Driver: ATIVO'];const h=t.head;
  L.push('Cabeça: '+['nunca recebeu','recebendo','SEM PACOTES'][Math.min(h.link,2)]+'  '+h.rate.toFixed(0)+' pacotes/s  ypr '+h.ypr.map(x=>x.toFixed(1)).join(' '));
  L.push('  "cima" da cabeça = ('+h.up.map(x=>x.toFixed(2)).join(', ')+') → '+(h.up[1]>0.5?'OK (de pé)':(h.up[1]<-0.5?'DE CABEÇA PRA BAIXO':'inclinada')));
  L.push('Mãos (câmera): '+['nunca','recebendo','sem pacotes'][Math.min(t.hands.link,2)]+'  '+t.hands.rate.toFixed(0)+' pkt/s');
  t.ctl.forEach((c,i)=>{L.push('Controle '+(i?'ESQUERDO':'DIREITO')+': '+['sem controle','conectado','calibrando'][Math.min(c.link,2)]+' | '+['?','ESP32','celular'][Math.min(c.kind,2)]+' | '+c.rate.toFixed(0)+' pkt/s | rssi '+c.rssi+' | '+'VR'+' | idade '+c.age.toFixed(0)+' ms | perdidos '+c.lost);
    L.push('   mpu '+c.mpu.map(x=>x.toFixed(1)).join(' ')+'  saída '+c.out.map(x=>x.toFixed(1)).join(' ')+'  altura rel. cabeça '+(c.posW[1]-h.pos[1]).toFixed(2)+' m')});
  L.push('Janela do headset: '+t.win.join(', '));L.push('');L.push('Diagnóstico do driver:');(t.log||[]).filter(x=>x).forEach(x=>L.push('  '+x));return L.join('\n')
}
async function tick(){
  try{
    const s=await api('/api/state');vals=Object.assign(vals,{});const rec=new Set(s.recent||[]);
    const st=document.getElementById('st');st.className='badge '+(s.t.alive?'on':'off');st.textContent=s.t.alive?'driver ativo':'SteamVR fechado';
    for(const k in s.values){if(rec.has(k)||(touched[k]&&Date.now()-touched[k]<1500))continue;vals[k]=s.values[k];const c=ctl[k];if(!c||document.activeElement===c.i)continue;
      if(c.w.t==='check')c.i.checked=!!vals[k];else{c.i.value=vals[k];if(c.v)c.v.textContent=fmtv(c.w,vals[k])}}
    if(cur>=M.tabs.length){const p=document.getElementById('dia');if(p)p.textContent=diagText(s.t);drawArms(s.t)}
  }catch(e){const st=document.getElementById('st');st.className='badge off';st.textContent='sem conexão'}
  setTimeout(tick,400)
}
(async()=>{M=await api('/manifest.json');const s=await api('/api/state');vals=s.values||{};
  const nav=document.getElementById('tabs');[...M.tabs.map(t=>t.name),'Diagnóstico'].forEach((n,i)=>{const b=$('button',i===0?'sel':'',n);b.onclick=()=>{cur=i;[...nav.children].forEach((x,j)=>x.className=j===i?'sel':'');build()};nav.appendChild(b)});
  build();tick()})();
</script></body></html>
